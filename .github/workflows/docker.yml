name: Build & Push Docker Image

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [[ "$TAG" == *"beta"* ]]; then
            echo "is_beta=true" >> $GITHUB_OUTPUT
          else
            echo "is_beta=false" >> $GITHUB_OUTPUT
          fi

      - name: Build base image
        run: docker build -t codeck-base:latest -f docker/Dockerfile.base .

      - name: Build app image
        run: docker build -t app:latest --build-arg BASE_IMAGE=codeck-base:latest -f docker/Dockerfile .

      - name: Tag and push
        run: |
          TAG=${{ steps.meta.outputs.tag }}
          IS_BETA=${{ steps.meta.outputs.is_beta }}

          # Tag with version
          docker tag app:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG

          # Tag with beta or latest
          if [ "$IS_BETA" = "true" ]; then
            docker tag app:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:beta
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:beta
          else
            docker tag app:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          fi

      - name: Summary
        run: |
          echo "### Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.meta.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Beta:** ${{ steps.meta.outputs.is_beta }}" >> $GITHUB_STEP_SUMMARY
