<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Codeck">
  <title>Codeck</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <!-- Inline critical CSS for instant loading spinner -->
  <style>
    :root { --bg-primary: #09090b; --accent: #8b5cf6; }
    body { margin: 0; background: var(--bg-primary); color: #fafafa; font-family: -apple-system, sans-serif; }
    #app { height: 100dvh; }
    /* Only center the inline loading spinner — removed once Preact mounts */
    #app > .view-loading { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 28px; height: 28px; border: 2px solid #333; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; margin: 0 auto 12px; }
  </style>
  <!-- Fonts: self-hosted for zero external dependency (loaded via fonts.css in main.tsx) -->
</head>
<body>
  <div id="app">
    <!-- Inline loading state — renders before JS loads -->
    <div class="view-loading"><div class="spinner"></div></div>
  </div>
  <script>
    // API prefetch — starts before main bundle loads, saving one full RTT.
    // The main app consumes window.__prefetch instead of making a new request.
    (function() {
      var t = localStorage.getItem('codeck_auth_token');
      if (t) {
        window.__prefetch = fetch('/api/status', { headers: { Authorization: 'Bearer ' + t } })
          .then(function(r) { return r.ok ? r.json() : null; })
          .catch(function() { return null; });
      } else {
        window.__prefetch = fetch('/api/auth/status')
          .then(function(r) { return r.ok ? r.json() : null; })
          .catch(function() { return null; });
      }
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
