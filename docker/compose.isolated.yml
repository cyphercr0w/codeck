# Codeck — Self-Hosted
#
# Single container with everything: runtime, web UI, terminal, memory.
# No daemon needed. Just docker compose up.
#
# Quick start:
#   docker compose up -d
#
# Or with the installer:
#   curl -fsSL https://codeck.xyz/install | bash

services:
  codeck:
    image: ${CODECK_IMAGE:-ghcr.io/cyphercr0w/codeck:latest}
    container_name: codeck
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    ports:
      - "${CODECK_PORT:-8080}:80"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - KILL
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          pids: 512
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    tmpfs:
      - /tmp:size=512M,mode=1777
      - /run:size=100M,mode=0755
    volumes:
      - codeck-workspace:/workspace
      - codeck-claude:/root/.claude
      - codeck-ssh:/root/.ssh
      - codeck-gh:/root/.config/gh
    environment:
      - CODECK_PORT=80
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

volumes:
  codeck-workspace:
  codeck-claude:
  codeck-ssh:
  codeck-gh:
